[project]
name = "alpha-platform"
version = "0.1.0"
description = "Alpha 管理平台 v0.1——BRAIN 漏斗右半段闭环：同步 / 分流 / 预判 / 报告 / 确认提交"
requires-python = ">=3.11"
# 设计 §1.2：运行时依赖只有 requests
dependencies = ["requests>=2.31"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["alpha_platform"]

[tool.pytest.ini_options]
testpaths = ["tests"]
